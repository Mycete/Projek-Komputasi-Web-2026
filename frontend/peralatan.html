<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daftar Peralatan SIPERALAB" />
    <title>SIPERALAB | Peralatan</title>
    <link rel="stylesheet" href="/src/images/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">SIPERALAB</a>

      <nav aria-label="Navigasi utama">
        <a href="/">Beranda</a>
        <a href="/peralatan.html">Peralatan</a>
        <a href="/peminjaman.html">Ajukan Peminjaman</a>
        <a href="/tentang.html">Tentang</a>
      </nav>
    </header>

    <main>
      <h1>Katalog Peralatan</h1>
      <section aria-labelledby="judul-katalog">
        <h2 id="judul-katalog">Peralatan yang dapat dipinjam</h2>

        <div class="equipment-list">
          <article class="equipment-card">
            <h3>Multimeter Digital</h3>
            <figure>
              <img
                src="/images/Multimeter.jpg"
                alt="Multimeter digital untuk pengukuran listrik"
                width="320"
              />
              <figcaption>
                Perangkat untuk pengukuran tegangan, arus, dan resistansi.
              </figcaption>
            </figure>

            <div class="equipment-meta">
              <p><strong>Stok:</strong> 6 unit</p>
              <p><strong>Kondisi:</strong> Baik</p>
            </div>
          </article>

          <article class="equipment-card">
            <h3>Router</h3>
            <figure>
              <img
                src="/images/router.jpg"
                alt="Router jaringan untuk praktikum konfigurasi jaringan"
                width="320"
              />
              <figcaption>
                Perangkat jaringan untuk latihan routing dan konektivitas.
              </figcaption>
            </figure>
            <div class="equipment-meta">
              <p><strong>Stok:</strong> 12 unit</p>
              <p><strong>Kondisi:</strong> Baik</p>
            </div>
          </article>

          <article class="equipment-card">
            <h3>Kamera</h3>
            <figure>
              <img
                src="/images/kamera.jpg"
                alt="Kamera digital untuk dokumentasi kegiatan laboratorium"
                width="320"
              />
              <figcaption>
                Kamera digital untuk dokumentasi dan kebutuhan praktikum.
              </figcaption>
            </figure>
            <div class="equipment-meta">
              <p><strong>Stok:</strong> 5 unit</p>
              <p><strong>Kondisi:</strong> Baik</p>
            </div>
          </article>

          <article class="equipment-card">
            <h3>Laptop</h3>
            <figure>
              <img
                src="/images/laptop.png"
                alt="Laptop untuk praktikum pemrograman dan pengolahan data"
                width="320"
              />
              <figcaption>
                Perangkat komputer untuk praktikum pemrograman dan pengolahan
                data.
              </figcaption>
            </figure>
            <div class="equipment-meta">
              <p><strong>Stok:</strong> 5 unit</p>
              <p><strong>Kondisi:</strong> Baik</p>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p><a href="/peminjaman.html">Lanjut ke formulir peminjaman</a></p>
    </footer>
    <script type="module" src="/src/images/main.js"></script>
  </body>
</html>
